<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mystic Notes</title>

    <!-- ADAUGĂ style.css pentru header -->
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: #f8f6f2;
            color: #4b3f35;
        }

        .container {
            width: 85%;
            margin: auto;
            padding: 20px;
        }

        .contact-info,
        .contact-form,
        .map {
            background: #ffffff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            border-bottom: 1px solid #e5dcd2;
            padding-bottom: 10px;
            color: #c9a27c;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #e5dcd2;
            border-radius: 8px;
            background: #fdfaf6;
            color: #4b3f35;
        }

        button {
            background: #c9a27c;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        iframe {
            width: 100%;
            height: 300px;
            border-radius: 10px;
        }

        /* DARK MODE */
        body.dark-mode {
            background: #1e1e1e;
            color: #f1f1f1;
        }

        body.dark-mode .contact-info,
        body.dark-mode .contact-form,
        body.dark-mode .map {
            background: #2a2a2a;
        }

        body.dark-mode input,
        body.dark-mode textarea {
            background: #333;
            color: #fff;
        }
    </style>
</head>

<body>

<!-- HEADER CA LA COLLECTION -->
<header class="header">
    <a href="index.html" class="logo">Mystic Notes</a>

    <div class="right-side">
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="index.html">Acasă</a></li>
                <li><a href="collection.html">Catalog</a></li>
                <li><a href="index.html#despre-noi">Despre Noi</a></li>
                <li><a href="Contact us.html">Contact</a></li>
                <li><a href="Crează Parfumul.html">Creează</a></li>

            </ul>
        </nav>

        <!-- BUTON DARK -->
        <button id="theme-toggle" class="theme-btn">🌙</button>
    </div>
</header>

<div class="container">

    <div class="contact-info">
        <h2>Contactează-ne</h2>
        <p><strong>Email:</strong> mysticnotes@gmail.com</p>
        <p><strong>Telefon:</strong> +373 600 12345</p>
        <p><strong>Adresă:</strong> Chișinău, Republica Moldova</p>
    </div>

    <div class="contact-form">
        <h2>Trimite-ne un mesaj</h2>
        <form>
            <input type="text" placeholder="Numele tău" required>
            <input type="email" placeholder="Emailul tău" required>
            <textarea rows="5" placeholder="Scrie mesajul tău..." required></textarea>
            <button type="submit">Trimite mesajul</button>
        </form>
    </div>

    <div class="map">
        <h2>Unde ne găsești</h2>
        <iframe src="https://www.google.com/maps?q=Chisinau&output=embed"></iframe>
    </div>

</div>

<script src="theme.js"></script>

</body>
</html>
